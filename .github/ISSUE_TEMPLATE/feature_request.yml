name: 功能建议
description: 提出适配或功能建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景和目标 App 版本。涉及自动点击、VPN 范围或季集恢复的建议，需要同时说明如何保持现有安全约束。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      placeholder: 现在遇到什么情况，现有功能为什么不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      placeholder: 描述期望的行为和触发条件。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      placeholder: 是否可以通过现有开关、兼容模式或自定义域名解决？
  - type: checkboxes
    id: constraints
    attributes:
      label: 安全约束
      options:
        - label: 我理解本项目不能在倒计时结束前自动点击、上滑或 BACK。
          required: true
        - label: 我理解本项目不会跨季自动选集，也不会扩大 VPN 接管范围到未勾选的应用。
          required: true
